[package]
name = "kittychart-preview"
description = "Dev tool: screenshots of KittyChart output inside a simulated terminal (Ghostty's VT core)"
publish = false
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "kc-preview"
path = "src/main.rs"

[dependencies]
kittychart = { workspace = true }
kittychart-canvas = { workspace = true }
kittychart-core = { workspace = true }
kittychart-term = { workspace = true }
kittychart-testkit = { workspace = true }
libghostty-vt = { workspace = true }
clap = { version = "4.5", features = ["derive"] }

[lints]
workspace = true
