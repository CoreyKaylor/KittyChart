[package]
name = "kittychart-wasm"
description = "KittyChart in the browser: a canvas chart and a terminal session, for the demo site"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
kittychart = { workspace = true }
kittychart-core = { workspace = true }
serde_json = { workspace = true }
# Pinned: the wasm-bindgen CLI that generates the JS glue must be this exact version.
wasm-bindgen = "=0.2.130"

[lints]
workspace = true
