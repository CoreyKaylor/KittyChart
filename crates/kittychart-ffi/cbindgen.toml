language = "C"
include_guard = "KITTYCHART_H"
pragma_once = true
cpp_compat = true
documentation_style = "c99"
autogen_warning = "/* Generated by cbindgen from crates/kittychart-ffi/src/lib.rs; do not edit. Regenerate with `just header`. */"
sys_includes = ["stddef.h", "stdint.h", "stdbool.h"]
no_includes = true
usize_is_size_t = true

[enum]
prefix_with_name = true
rename_variants = "ScreamingSnakeCase"

[export]
prefix = ""
