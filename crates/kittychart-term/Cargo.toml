[package]
name = "kittychart-term"
description = "Terminal graphics encoders (kitty, sixel, unicode) and sans-IO capability detection for KittyChart"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "../../README.md"
include = ["src/**/*", "Cargo.toml", "LICENSE", "THIRD-PARTY-NOTICES"]

[features]
default = ["tty"]
# The real-terminal adapter (raw mode, reads with a timeout): Unix, and Windows (unverified).
# Everything else in this crate is sans-IO and always available.
tty = ["dep:rustix", "dep:windows-sys"]

[dependencies]
base64 = { workspace = true }
flate2 = { workspace = true }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.6", optional = true, features = ["termios", "std", "fs", "shm"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", optional = true, features = [
    "Win32_Foundation",
    "Win32_System_Console",
    "Win32_System_Threading",
] }

[dev-dependencies]
kittychart-testkit = { workspace = true }
insta = { workspace = true }
proptest = { workspace = true }

[lints]
workspace = true
