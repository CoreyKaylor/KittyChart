[package]
name = "kittychart-term"
description = "Terminal graphics encoders (kitty, sixel, unicode) and sans-IO capability detection for KittyChart"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[features]
default = ["tty"]
# The real-terminal adapter (raw mode, polling with a timeout). Unix only. Everything else in
# this crate is sans-IO and always available.
tty = ["dep:rustix"]

[dependencies]
base64 = { workspace = true }
flate2 = { workspace = true }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.6", optional = true, features = ["termios", "std"] }

[dev-dependencies]
kittychart-testkit = { workspace = true }
insta = { workspace = true }
proptest = { workspace = true }

[lints]
workspace = true
