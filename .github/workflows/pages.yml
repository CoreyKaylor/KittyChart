name: Pages

# Publishes the demo site (web/: a canvas and a browser terminal, both running KittyChart as
# WebAssembly) at the root of GitHub Pages, and the docs (docs/, an mdBook) under /docs/.
#
# Manual: Actions → Pages → Run workflow. Enable Pages with "GitHub Actions" as the source in
# the repository settings first. Build and check the same site locally with `just web-test`
# (or `just web-serve` to look at it).

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with: { targets: wasm32-unknown-unknown }
      - uses: Swatinem/rust-cache@v2
        with: { key: pages }
      - id: tools
        name: Tool versions (wasm-bindgen pinned by crates/kittychart-wasm, mdBook by mise.toml)
        run: |
          echo "bindgen=$(sed -n 's/^wasm-bindgen = "=\(.*\)"/\1/p' crates/kittychart-wasm/Cargo.toml)" >> "$GITHUB_OUTPUT"
          echo "mdbook=$(sed -n 's/^"cargo:mdbook" = "\(.*\)".*/\1/p' mise.toml)" >> "$GITHUB_OUTPUT"
      - uses: taiki-e/install-action@v2
        with: { tool: "wasm-bindgen-cli@${{ steps.tools.outputs.bindgen }},mdbook@${{ steps.tools.outputs.mdbook }}" }
      - uses: actions/setup-node@v4
        with: { node-version: "26" }

      - uses: actions/configure-pages@v5

      - name: Build the demo site
        env:
          OUT: ${{ github.workspace }}/_site
          KC_REPO_URL: ${{ github.server_url }}/${{ github.repository }}
          KC_REPO_REF: ${{ github.sha }}
        run: web/build.sh

      - name: Smoke test in headless Chromium
        run: |
          (cd tools/reference && npm ci --no-audit --no-fund && npx playwright-core install --with-deps chromium)
          node web/test/smoke.mjs _site

      - uses: actions/upload-pages-artifact@v3
        with: { path: _site }

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
