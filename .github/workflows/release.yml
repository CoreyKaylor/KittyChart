name: Release

# Push a tag like v0.1.0 (with versions bumped in Cargo.toml, both workspace.package.version and
# the internal crates' versions under workspace.dependencies, and in bindings/node/package.json)
# to build every distributable and publish it:
#   - GitHub release: the `kittychart` CLI and the C library (header, static + shared) per platform
#   - crates.io: kittychart, kittychart-cli, kittychart-ratatui, kittychart-ffi and the crates
#     they depend on
#   - PyPI: abi3 wheels (one per platform, Python ≥ 3.9) + sdist, via trusted publishing
#   - npm: `kittychart` plus one prebuilt native package per platform, via trusted publishing
# Run it by hand (workflow_dispatch) to build everything without publishing.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  cli:
    name: CLI + C library (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
          - { os: macos-15-intel, target: x86_64-apple-darwin }
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release --locked -p kittychart-cli -p kittychart-ffi
      - name: Package
        shell: bash
        run: |
          name="kittychart-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir -p "$name/lib" "$name/include"
          cp crates/kittychart-ffi/include/kittychart.h "$name/include/"
          cp README.md LICENSE THIRD-PARTY-NOTICES "$name/"
          cd target/release
          if [ "$RUNNER_OS" = Windows ]; then
            cp kittychart.exe "../../$name/"
            cp kittychart_ffi.dll kittychart_ffi.dll.lib kittychart_ffi.lib "../../$name/lib/"
            cd ../.. && 7z a "$name.zip" "$name"
          else
            cp kittychart "../../$name/"
            cp libkittychart_ffi.a "../../$name/lib/"
            cp libkittychart_ffi.so "../../$name/lib/" 2>/dev/null || cp libkittychart_ffi.dylib "../../$name/lib/"
            cd ../.. && tar czf "$name.tar.gz" "$name"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.target }}
          # The archives only: `kittychart-*.*` would also match the staging directory, whose
          # name has the version's dots in it.
          path: |
            kittychart-*.tar.gz
            kittychart-*.zip

  wheels:
    name: Python wheel (${{ matrix.platform }} ${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, platform: manylinux, target: x86_64 }
          - { os: ubuntu-24.04-arm, platform: manylinux, target: aarch64 }
          - { os: ubuntu-24.04, platform: musllinux, target: x86_64 }
          - { os: ubuntu-24.04-arm, platform: musllinux, target: aarch64 }
          - { os: macos-15-intel, platform: macos, target: x86_64 }
          - { os: macos-latest, platform: macos, target: aarch64 }
          - { os: windows-latest, platform: windows, target: x64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: License files into the package
        shell: bash
        run: cp LICENSE THIRD-PARTY-NOTICES bindings/python/
      # macOS and Windows build with the runner's Rust, which can be well behind (Linux builds
      # in maturin's containers).
      - uses: dtolnay/rust-toolchain@stable
      - uses: PyO3/maturin-action@v1
        with:
          working-directory: bindings/python
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.platform == 'manylinux' && 'auto' || matrix.platform == 'musllinux' && 'musllinux_1_2' || '' }}
          args: --release --locked --out dist
      # Smoke-test the wheel itself (not the source tree): install it into a clean venv.
      - name: Test the wheel
        if: matrix.platform != 'musllinux'
        shell: bash
        env:
          PYTHONUTF8: "1" # the text chart's Braille, on a Windows console
        run: |
          python -m venv /tmp/wheel-venv || python -m venv wheel-venv
          venv=$( [ -d /tmp/wheel-venv ] && echo /tmp/wheel-venv || echo wheel-venv )
          py="$venv/bin/python"; [ -x "$py" ] || py="$venv/Scripts/python.exe"
          "$py" -m pip install --no-index --find-links bindings/python/dist kittychart
          "$py" -c "import kittychart; c = kittychart.Chart(type='bar', data={'labels': ['a'], 'datasets': [{'data': [1]}]}); assert c.to_png()[:4] == b'\x89PNG'; print(c.to_text(30))"
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.platform }}-${{ matrix.target }}
          path: bindings/python/dist/*.whl

  sdist:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: License files into the package
        shell: bash
        run: cp LICENSE THIRD-PARTY-NOTICES bindings/python/
      - uses: PyO3/maturin-action@v1
        with:
          working-directory: bindings/python
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: bindings/python/dist/*.tar.gz

  node:
    name: Node module (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
          - { os: macos-15-intel, target: x86_64-apple-darwin }
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
          # musl (Alpine): cross-built with zig, tested in an Alpine container.
          - { os: ubuntu-24.04, target: x86_64-unknown-linux-musl, musl: true }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl, musl: true }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: bindings/node
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: "${{ matrix.target }}" }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - if: matrix.musl
        uses: mlugg/setup-zig@v2
        with: { version: 0.15.2 }
      - if: matrix.musl
        run: cargo install cargo-zigbuild --locked --version 0.24.1
      - run: npm ci --no-audit --no-fund
      - run: npx napi build --platform --release --target ${{ matrix.target }} ${{ matrix.musl && '-x' || '' }} --js binding.js --dts binding.d.ts
      - if: "!matrix.musl"
        run: npm test
      - if: matrix.musl
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/repo" -w /repo/bindings/node node:22-alpine \
            node --test __test__/chart.test.js
      - uses: actions/upload-artifact@v4
        with:
          name: node-${{ matrix.target }}
          path: |
            bindings/node/*.node
            bindings/node/binding.js
            bindings/node/binding.d.ts

  # Packages every published crate and builds it from the package, as crates.io will see it.
  crates:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: License files into the crates
        run: for d in crates/kittychart crates/kittychart-{canvas,term,core,cli,ratatui,ffi}; do cp LICENSE THIRD-PARTY-NOTICES "$d/"; done
      # --allow-dirty: the license copies above are not committed.
      - run: cargo publish --workspace --dry-run --locked --allow-dirty

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [cli, wheels, sdist, node, crates]
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write # GitHub release
      id-token: write # trusted publishing: PyPI, npm
    steps:
      - uses: actions/checkout@v4
      - name: Versions match the tag
        run: |
          tag="${GITHUB_REF_NAME#v}"
          cargo=$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"/\1/p' Cargo.toml)
          node=$(node -p "require('./bindings/node/package.json').version")
          deps=$(grep -c "^kittychart.*version = \"$tag\"" Cargo.toml)
          echo "tag $tag, Cargo.toml $cargo, package.json $node, $deps/5 internal crate versions"
          [ "$tag" = "$cargo" ] && [ "$tag" = "$node" ] && [ "$deps" = 5 ]
      - uses: actions/download-artifact@v4
        with: { path: artifacts }
      - uses: dtolnay/rust-toolchain@stable
      - name: crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          for d in crates/kittychart crates/kittychart-{canvas,term,core,cli,ratatui,ffi}; do cp LICENSE THIRD-PARTY-NOTICES "$d/"; done
          # One crate at a time, dependencies first, so a re-run skips what is already published
          # and crates.io's limit on new crates (a burst of 5, then one every 10 minutes) waits.
          version="${GITHUB_REF_NAME#v}"
          for c in kittychart-canvas kittychart-term kittychart-core kittychart kittychart-cli kittychart-ffi kittychart-ratatui; do
            if curl -sf -A "kittychart-release (https://github.com/CoreyKaylor/KittyChart)" \
                "https://crates.io/api/v1/crates/$c/$version" > /dev/null; then
              echo "$c $version is already on crates.io"; continue
            fi
            until out=$(cargo publish -p "$c" --locked --allow-dirty 2>&1); do
              echo "$out"
              grep -q "429 Too Many Requests" <<< "$out" || exit 1
              echo "Rate limited: retrying $c in 5 minutes"; sleep 300
            done
            echo "$out" | tail -3
          done
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --generate-notes artifacts/cli-*/*
      - name: Collect Python distributions
        run: mkdir -p pydist && cp artifacts/wheel-*/*.whl artifacts/sdist/*.tar.gz pydist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with: { packages-dir: pydist }
      # npm trusted publishing: each of the eight packages (kittychart and its seven platform
      # packages) trusts this workflow and the `release` environment, so no token is needed.
      # Provenance is added automatically. It needs npm 11.5.1 or later.
      - uses: actions/setup-node@v4
        with: { node-version: 24, registry-url: "https://registry.npmjs.org" }
      - name: npm
        working-directory: bindings/node
        run: |
          npm install -g npm@11
          npm ci --no-audit --no-fund
          cp ../../LICENSE ../../THIRD-PARTY-NOTICES .
          cp ../../artifacts/node-x86_64-unknown-linux-gnu/binding.js ../../artifacts/node-x86_64-unknown-linux-gnu/binding.d.ts .
          mkdir -p modules && cp ../../artifacts/node-*/*.node modules/
          npx napi create-npm-dirs
          npx napi artifacts --output-dir modules
          npx napi pre-publish -t npm --skip-optional-publish
          for dir in npm/*/; do
            cp LICENSE THIRD-PARTY-NOTICES "$dir"
            (cd "$dir" && node -e "const f=require('fs'),p=JSON.parse(f.readFileSync('package.json'));p.files=[...(p.files||[]),'THIRD-PARTY-NOTICES'];f.writeFileSync('package.json',JSON.stringify(p,null,2)+'\\n')")
          done
          for dir in npm/*/; do (cd "$dir" && npm publish --access public); done
          npm publish --access public
