name: CI

# Changes that can't affect a build or test skip CI: the docs (Pages builds them), Markdown,
# licenses, the demo site (web/, built and smoke-tested by the Pages workflow) and the
# reference/replay tools (used by `just parity` and by hand). Keep both lists in sync.
on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "**/*.md", "LICENSE-*", "web/**", "tools/**"]
  pull_request:
    paths-ignore: ["docs/**", "**/*.md", "LICENSE-*", "web/**", "tools/**"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: "rustfmt, clippy", targets: wasm32-unknown-unknown }
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      # Default members only: clippy on the conformance crate would need Zig.
      - run: cargo clippy --all-targets -- -D warnings
      # The demo site's WebAssembly build (web/build.sh).
      - run: cargo clippy -p kittychart-wasm --target wasm32-unknown-unknown -- -D warnings

  # L0–L2: unit, goldens, protocol. Pure Rust, every OS. Goldens use the DSSIM tolerance, so
  # anti-aliasing differences between architectures don't fail the build.
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with: { tool: cargo-nextest }
      - run: cargo nextest run --profile ci
      - name: Upload golden diffs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: kc-diffs-${{ matrix.os }}
          path: target/kc-diffs/
          if-no-files-found: ignore

  # L3: Ghostty's real VT core, in-process. Zig comes from mise.toml. The built libghostty-vt
  # is cached in target/ by rust-cache, keyed on Cargo.lock, which pins the Ghostty commit
  # through libghostty-vt-sys.
  conformance:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: clippy }
      - uses: jdx/mise-action@v2
        with:
          install_args: "zig uv node aqua:nextest-rs/nextest/cargo-nextest"
      - uses: Swatinem/rust-cache@v2
        with: { key: libghostty }
      # libsixel's decoder checks the sixel encoder independently of our own decoder; tmux is
      # the multiplexer in the end-to-end tests.
      - run: sudo apt-get update && sudo apt-get install -y libsixel-bin tmux
      - run: cargo clippy -p kittychart-conformance -p kittychart-python -p kittychart-node --all-targets -- -D warnings
      # The end-to-end tests run the Python and Node packages (and a C program) on a PTY.
      - run: cd bindings/python && uv sync --group dev
      - run: cd bindings/node && npm ci --no-audit --no-fund && npm run build:debug
      - run: cargo nextest run --profile ci -p kittychart-conformance

  # L5: the bindings' own suites. pytest (numpy, pandas, polars, Rich, Textual, IPython) and
  # node:test + tsc against Chart.js's types. Pixels are compared with the Rust goldens.
  bindings:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { key: bindings }
      - uses: jdx/mise-action@v2
        with:
          install_args: "uv node"
      - name: Python
        shell: bash
        run: cd bindings/python && uv sync --group dev && uv run pytest -q
      - name: Node
        shell: bash
        run: cd bindings/node && npm ci --no-audit --no-fund && npm run build:debug && npm test
