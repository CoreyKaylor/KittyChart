# Pinned dev toolchain. `mise install` sets up everything needed for `just test-all`.
[tools]
zig = "0.15.2"                                       # crates/kittychart-conformance (libghostty-vt), musl cross builds
just = "1.59.0"
"aqua:nextest-rs/nextest/cargo-nextest" = "0.9.151"
"cargo:cargo-insta" = "1.49.0"                       # cargo backend: no prebuilt linux/arm64 binary
"cargo:cargo-zigbuild" = "0.24.1"                    # `napi build -x` for the musl Node targets
node = "26.13.0"                                     # tools/reference + bindings/node
uv = "0.13.7"                                        # bindings/python
"cargo:mdbook" = "0.5.4"                             # docs/ → the site's /docs (web/build.sh); cargo backend: no aqua linux/arm64 build
